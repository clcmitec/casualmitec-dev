<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MITEC — Staff Duty Sign Out</title>

  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 🚀 FIREBASE FIRESTORE INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "casualmitec-apps"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firestoreTools = { collection, getDocs, doc, updateDoc };
    console.log("🔥 Firebase Firestore connected on Sign-Out Page!");
  </script>

  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-blue-dark: #071a3d;
      --bg-base: #f8f9fa; 
      --card-bg: #ffffff;
      --text-main: #2c2c2e;
      --text-muted: #6e6e73;
      --border-color: #d1d1d6;
      --shadow-standard: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body { 
      margin: 0; padding: 40px 20px; 
      background-color: var(--bg-base);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    .container { max-width: 400px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 32px; }
    .brand-img { height: 24px; width: auto; }

    .profile-card {
      background: var(--mitec-blue);
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 24px;
    }

    .avatar { 
      width: 56px; height: 56px; border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.2); object-fit: cover; 
      background: rgba(255,255,255,0.1); 
    }

    .profile-info { flex: 1; }
    .profile-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 4px; display: block; }
    .profile-name { font-size: 16px; font-weight: 600; margin: 0; }

    .form-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-standard);
    }

    .section-title { 
      font-size: 13px; font-weight: 700; color: var(--mitec-blue); 
      margin-bottom: 20px; display: block; border-bottom: 1px solid #eee; padding-bottom: 8px;
    }

    .field { margin-bottom: 16px; }

    .input-wrapper { position: relative; display: flex; align-items: center; }

    .input-icon {
      position: absolute; left: 14px;
      font-size: 18px; color: var(--text-muted);
      pointer-events: none;
    }

    .input-field {
      width: 100%; height: 52px; border-radius: 8px;
      border: 1px solid var(--border-color); background: #fff;
      padding: 0 12px 0 44px; font-size: 15px;
      outline: none; transition: border 0.2s;
      appearance: none; color: var(--text-main);
    }

    .input-field:focus { border-color: var(--mitec-blue); }

    .btn-submit {
      width: 100%; height: 52px; border-radius: 8px;
      background: var(--mitec-blue); color: #fff;
      font-size: 15px; font-weight: 600; border: none;
      cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
    }
    .btn-submit:hover { background: var(--mitec-blue-dark); }

    /* FROSTED GLASS OVERLAY */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 34, 83, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }

    .overlay-card {
      background: #ffffff; border-radius: 20px; padding: 28px 20px;
      max-width: 340px; width: 100%; text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      display: flex; flex-direction: column; align-items: center;
    }

    .spinner { 
      width: 40px; height: 40px; border: 3px solid #eee; 
      border-top: 3px solid var(--mitec-blue); border-radius: 50%; 
      animation: spin 0.8s linear infinite; margin-bottom: 20px; 
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
    </div>

    <div class="profile-card">
      <img id="workerAvatar" class="avatar" src="https://via.placeholder.com/100" alt="Profile">
      <div class="profile-info">
        <span class="profile-label">Current User</span>
        <h2 class="profile-name" id="workerName">Loading Profile...</h2>
      </div>
    </div>

    <div class="form-card">
      <span class="section-title">End Duty Shift</span>

      <!-- VOUCHER NUMBER INPUT FOR SIGN OUT VERIFICATION -->
      <div class="field">
        <div class="input-wrapper">
          <i class="ph ph-ticket input-icon"></i>
          <input type="text" id="inpVoucherSignOut" class="input-field" placeholder="Enter Voucher Number (6-Digits)" maxlength="6" pattern="\d{1,6}" inputmode="numeric" required>
        </div>
      </div>

      <button id="btnSignOut" class="btn-submit" onclick="submitSignOut()">
        <i class="ph ph-sign-out"></i>
        Confirm Sign Out
      </button>
    </div>
  </div>

  <!-- STATUS OVERLAY MODAL -->
  <div id="statusOverlay" class="overlay">
    <div class="overlay-card">
      <div id="spinner" class="spinner"></div>
      <h2 id="statusTitle" style="margin: 0; font-size: 20px; font-weight: 700;">Processing...</h2>
      <p id="statusMsg" style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">Please wait...</p>
      <button id="closeBtn" class="btn-submit" style="display: none; margin-top: 20px; width: 100%;" onclick="window.location.href='dashboard.html'">Return to Home</button>
    </div>
  </div>

  <script>
    function convertToDirectLink(url) {
      if (!url) return "";
      let stringUrl = String(url);
      if (stringUrl.includes("drive.google.com")) {
        const match = stringUrl.match(/\/file\/d\/([^/?]+)/) || stringUrl.match(/id=([^&]+)/);
        if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}`;
      }
      return stringUrl;
    }

    function loadIdentity() {
      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      const nameEl = document.getElementById("workerName");
      const avatarEl = document.getElementById("workerAvatar");

      const fullName = record["FULL NAME (AS PER IC / PASSPORT)"] || record.name_mykad || record.full_name || record.nama || "Staff Member";
      nameEl.textContent = fullName;

      const photo = record["PASSPORT-SIZE PHOTO LINK"] || record.photo_link;
      if (photo) avatarEl.src = convertToDirectLink(photo);
    }

    function calculateHoursWorked(signInStr, signOutStr) {
      if (!signInStr || !signOutStr) return "0.0";

      const parseTime = (tStr) => {
        const parts = tStr.split(":");
        if (parts.length < 2) return null;
        let hours = parseInt(parts[0], 10);
        let minutes = parseInt(parts[1], 10);
        if (tStr.toLowerCase().includes("pm") && hours < 12) hours += 12;
        if (tStr.toLowerCase().includes("am") && hours === 12) hours = 0;
        return hours * 60 + minutes;
      };

      const startMins = parseTime(signInStr);
      const endMins = parseTime(signOutStr);

      if (startMins === null || endMins === null) return "0.0";

      let diff = endMins - startMins;
      if (diff < 0) diff += 24 * 60; // Overnight shift calculation

      return (diff / 60).toFixed(1);
    }

    async function submitSignOut() {
      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      const rawVoucher = document.getElementById("inpVoucherSignOut").value.trim();

      if (!rawVoucher || !/^\d{1,6}$/.test(rawVoucher)) {
        alert("Please enter a valid Voucher Number.");
        return;
      }

      const overlay = document.getElementById("statusOverlay");
      const title = document.getElementById("statusTitle");
      const msg = document.getElementById("statusMsg");
      const spinner = document.getElementById("spinner");
      const closeBtn = document.getElementById("closeBtn");

      overlay.style.display = "flex";
      spinner.style.display = "block";
      closeBtn.style.display = "none";

      try {
        if (window.db && window.firestoreTools) {
          const { collection, getDocs, doc, updateDoc } = window.firestoreTools;

          const snapshot = await getDocs(collection(window.db, "shifts"));

          let activeShiftDoc = null;

          snapshot.forEach((docSnap) => {
            const data = docSnap.data();

            const storedVoucher = String(data.voucher_no || data.voucher || "").trim();

            const isVoucherMatch = (storedVoucher === rawVoucher) || (Number(storedVoucher) === Number(rawVoucher));
            const isOpenShift = !data.sign_out_time || String(data.sign_out_time).trim() === "";

            if (isVoucherMatch && isOpenShift) {
              activeShiftDoc = { id: docSnap.id, ...data };
            }
          });

          if (!activeShiftDoc) {
            spinner.style.display = "none";
            title.textContent = "Sign Out Failed";
            title.style.color = "#dc3545";
            msg.textContent = `No active shift found for Voucher: ${rawVoucher}. Please verify your voucher number.`;
            closeBtn.style.display = "block";
            closeBtn.textContent = "Try Again";
            closeBtn.onclick = () => { overlay.style.display = "none"; };
            return;
          }

          const now = new Date();
          const signOutTimeFormatted = now.toLocaleTimeString('en-GB', { 
            hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' 
          });

          const hoursWorked = calculateHoursWorked(activeShiftDoc.sign_in_time, signOutTimeFormatted);

          const shiftDocRef = doc(window.db, "shifts", activeShiftDoc.id);
          await updateDoc(shiftDocRef, {
            sign_out_time: signOutTimeFormatted,
            hours_worked: hoursWorked,
            sign_out_timestamp: now.toISOString(),
            updated_at: new Date()
          });

          spinner.style.display = "none";
          title.textContent = "Sign Out Successful";
          title.style.color = "#28a745";
          msg.innerHTML = `Voucher <strong>${rawVoucher}</strong> signed out at <strong>${signOutTimeFormatted}</strong>.<br>Hours Worked: <strong>${hoursWorked} hrs</strong>`;
          closeBtn.style.display = "block";
          closeBtn.textContent = "Return to Home";
          closeBtn.onclick = () => { window.location.href = 'dashboard.html'; };
        }
      } catch (err) {
        console.error("Sign-out submission error:", err);
        spinner.style.display = "none";
        title.textContent = "Submission Error";
        title.style.color = "#dc3545";
        msg.textContent = "Could not record sign out. Please check connection and try again.";
        closeBtn.style.display = "block";
        closeBtn.textContent = "Try Again";
        closeBtn.onclick = () => { overlay.style.display = "none"; };
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      const docNo = localStorage.getItem("mcl_doc_no") || record["IC / PASSPORT NUMBER"] || record.mykad_passport_no;

      if (!docNo) {
        window.location.href = "index.html";
      } else {
        loadIdentity();
      }
    });
  </script>
</body>
</html>
